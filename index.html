<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>设备回收 · 物证 A7-巳</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-page="hub">
<div id="app">

  <!-- 状态栏：伪装成设备，不出现任何"游戏"字样 -->
  <header class="status-bar">
    <span class="sb-left" id="sbClock">--:--</span>
    <span class="sb-m-id" id="sbTitle">物证 A7-巳 · 恢复数据</span>
    <span class="sb-right" id="sbProg">未解锁</span>
    <button class="toggle" id="btnAudio" type="button">声音 ○</button>
    <button class="toggle" id="btnFx" type="button">特效 ●</button>
  </header>

  <!-- 桌面：回收手机 hub -->
  <main class="hub" id="hub">
    <section class="device">
      <div class="device-notch"></div>
      <div class="device-screen">
        <div class="lock">
          <div class="lock-glyph">巳</div>
          <p class="lock-sub">一部无人认领的移动终端</p>
          <p class="lock-note" id="lockNote">数据自碎片恢复。以下为机主残存内容，请自行拼合。</p>
        </div>
        <nav class="appgrid" id="appgrid"><!-- 应用由 app.js 注入 --></nav>
      </div>
    </section>

    <aside class="sidetip">
      <h3>恢复日志</h3>
      <ul id="logList"><li class="muted">尚无操作。</li></ul>
    </aside>
  </main>

</div>

<!-- 脚本：data.js（内容库）/ app.js（逻辑层）。真·多页面：首页 hub + 各功能区独立 .html -->
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
